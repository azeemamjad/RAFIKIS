<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rafikis - Open Graph card</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./brand.css" />
    <link rel="stylesheet" href="./templates.css" />
    <style>
      /* Charcoal field with the wordmark centred and nothing else. Same
         treatment as public/favicon.svg, scaled to a landscape card.

         scripts/make-og.py produces the shipped public/og.jpg from the wordmark
         artwork Azeem supplied, so that file is the source of record. This page
         is the reference for the layout, and renders the same composition from
         the self-hosted font. */
      #og-card {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #og-card .wordmark {
        font-family: "Rafikis", "Work Sans", sans-serif;
        font-size: 190px;
        letter-spacing: 0.1em;
        line-height: 1;
        color: var(--sandstone);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <section class="card" id="og-card">
      <span class="wordmark">RAFIKIS</span>
    </section>
  </body>
</html>
