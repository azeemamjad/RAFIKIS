<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rafikis — app icons</title>
    <style>
      body {
        margin: 0;
        background: #0b0b0b;
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-end;
      }
      .icon {
        background: #111111;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- The "R" is traced from the official Rafikis wordmark artwork, so the
         app icon is the same letterform as the logo, only larger in frame. -->
    <div class="icon" id="icon-512" style="width: 512px; height: 512px">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#111111" />
        <g transform="translate(16.5 24) scale(0.67)" fill="#CEA984">
          <path
            fill-rule="evenodd"
            d="M0,0 H36 Q52,0 52,22.5 Q52,40 40,44.5 L56,100 H41.5 L27,46.5 H13.5 V100 H0 Z M13.5,12.5 H34 Q39,12.5 39,22.5 Q39,32.5 34,32.5 H13.5 Z"
          />
        </g>
      </svg>
    </div>

    <div class="icon" id="icon-180" style="width: 180px; height: 180px">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#111111" />
        <g transform="translate(16.5 24) scale(0.67)" fill="#CEA984">
          <path
            fill-rule="evenodd"
            d="M0,0 H36 Q52,0 52,22.5 Q52,40 40,44.5 L56,100 H41.5 L27,46.5 H13.5 V100 H0 Z M13.5,12.5 H34 Q39,12.5 39,22.5 Q39,32.5 34,32.5 H13.5 Z"
          />
        </g>
      </svg>
    </div>

    <div class="icon" id="icon-32" style="width: 32px; height: 32px">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#111111" />
        <g transform="translate(14 22) scale(0.72)" fill="#CEA984">
          <path
            fill-rule="evenodd"
            d="M0,0 H36 Q52,0 52,22.5 Q52,40 40,44.5 L56,100 H41.5 L27,46.5 H13.5 V100 H0 Z M13.5,12.5 H34 Q39,12.5 39,22.5 Q39,32.5 34,32.5 H13.5 Z"
          />
        </g>
      </svg>
    </div>
  </body>
</html>
