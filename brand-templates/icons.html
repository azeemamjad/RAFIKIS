<!doctype html>

    <title>Rafikis — app icons</title>
    <style>
      body {
        margin: 0;
        background: #0b0b0b;
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-end;
      }
      .icon {
        background: #111111;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }

    <!-- The "R" is traced from the official Rafikis wordmark artwork, so the
         app icon is the same letterform as the logo, only larger in frame.
         It is generated by scripts/make-icons.py and inlined here so the raster
         exports and public/favicon.svg can never drift apart. -->
